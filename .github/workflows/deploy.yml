name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}
  # I-091: the event-day swap. src/data/events.ts changes the launch-party page at 23:00 UTC on Nov 22, 2026 (4:00 pm MST),
  # in a build made then. GitHub may run schedules late or drop one, so three runs, none on the hour (4:07, 4:22 and
  # 4:45 pm MST); each rebuilds and redeploys, so a second or third changes nothing. Delete this block after the party
  # (docs/runbooks/events.md). The `gate` job below skips scheduled runs in any year but 2026.
  schedule:
    - cron: '7 23 22 11 *'
    - cron: '22 23 22 11 *'
    - cron: '45 23 22 11 *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # I-091 year guard: the crons above fire every Nov 22; only 2026 should deploy. A push or Run workflow always does.
  gate:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.y.outputs.go }}
    steps:
      - id: y
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(date -u +%Y)" != "2026" ]; then
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          PUBLIC_GOOGLE_MAPS_KEY: ${{ vars.PUBLIC_GOOGLE_MAPS_KEY }}
      - run: npm test
      - run: npm run check:wording
      - run: npm run check:dist
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: d
